[project]
name = "code-health"
version = "0.1.0"
description = "Code Health scoring for agent-written code: smells, scores and a safeguard."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "tree-sitter>=0.26.1",
    "tree-sitter-language-pack>=1.25.2",
]

[project.scripts]
code-health = "code_health.cli:main"

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
